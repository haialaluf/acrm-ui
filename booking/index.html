<!doctype html>
<!-- The page ships Hebrew and English; `main.tsx` sets `lang`/`dir` from the
     visitor's choice or browser before the first paint. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#cb6441" />
    <!-- A booking URL is a bearer credential: keep it out of search results
         and out of the Referer header of anything the page links to. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <!-- Link preview for WhatsApp, Telegram, Slack. Deliberately generic: the
         same card for every token, so a forwarded booking URL reveals no
         organization, calendar or contact. The crawler runs no JS, so these
         must be static markup, not the title `App.tsx` sets at runtime. No
         `og:url` — pinning a canonical URL would make the crawler show that one
         instead of the tokenised URL actually sent. -->
    <meta name="description" content="Pick a time that works for you." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DelaCRM" />
    <meta property="og:title" content="Book an appointment" />
    <meta property="og:description" content="Pick a time that works for you." />
    <!-- Absolute: relative OG image paths are unreliable across crawlers. Same
         hardcoded origin as `bookingBaseUrl()`'s default in the API. -->
    <meta
      property="og:image"
      content="https://calendar.delacrm.com/apple-touch-icon.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="DelaCRM" />
    <!-- `summary`, not `summary_large_image`: the icon is square, and claiming
         a large card for it produces a broken crop. -->
    <meta name="twitter:card" content="summary" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <title>Book an appointment</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/booking/main.tsx"></script>
  </body>
</html>
